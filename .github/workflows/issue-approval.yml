name: Scheduled Issue Approval Counter

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  tally-votes-and-move:
    runs-on: ubuntu-latest
    steps:
      - name: Check Approval Reactions, Move Card, Label, and Comment
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: "sud0-squad"
          PROJECT_NUM: 3
        run: |
          set -euo pipefail

          THRESHOLD=4
          APPROVAL_LABEL="approved"
          SOURCE_STATUS="Approvals"
          TARGET_STATUS="Approved"

          # Ensure label exists
          if ! gh api "repos/$REPO/labels/$APPROVAL_LABEL" >/dev/null 2>&1; then
            gh label create "$APPROVAL_LABEL" \
              --color "0e8a16" \
              --description "Issue reached approval threshold" \
              --repo "$REPO"
          fi

          # Project metadata
          PROJ_ID=$(gh project view "$PROJECT_NUM" --owner "$OWNER" --format json --jq '.id')
          STATUS_FIELD_ID=$(gh project field-list "$PROJECT_NUM" --owner "$OWNER" --format json --jq '.fields[] | select(.name=="Status") | .id')
          TARGET_OPT_ID=$(gh project field-list "$PROJECT_NUM" --owner "$OWNER" --format json --jq '.fields[] | select(.name=="Status") | .options[] | select(.name=="'"$TARGET_STATUS"'") | .id')

          # Only items currently in "Approval"
          ITEMS_IN_APPROVAL=$(gh project item-list "$PROJECT_NUM" --owner "$OWNER" --format json --jq \
            '.items[]
            | select(.content != null and .content.number != null)
            | select(.fieldValues[]? | select(.field.name=="Status" and .name=="'"$SOURCE_STATUS"'"))
            | "\(.id) \(.content.number)"')

          if [ -z "${ITEMS_IN_APPROVAL:-}" ]; then
            echo "No issues in '$SOURCE_STATUS'."
            exit 0
          fi

          while IFS=' ' read -r ITEM_ID ISSUE_NUMBER; do
            [ -z "${ITEM_ID:-}" ] && continue
            [ -z "${ISSUE_NUMBER:-}" ] && continue

            echo "Checking issue #$ISSUE_NUMBER..."

            # Skip if already labeled approved
            if gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx "$APPROVAL_LABEL"; then
              echo "Already labeled '$APPROVAL_LABEL', skipping."
              echo "----------------------------------------"
              continue
            fi

            # Count ONLY unique users who reacted +1 to issue body
            UNIQUE_REACTION_COUNT=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPO/issues/$ISSUE_NUMBER/reactions?per_page=100" \
              --jq '[.[] | select(.content == "+1") | .user.login] | unique | length')

            echo "Unique 👍 approvals: $UNIQUE_REACTION_COUNT"

            if [ "$UNIQUE_REACTION_COUNT" -ge "$THRESHOLD" ]; then
              echo "Threshold reached. Moving to '$TARGET_STATUS'..."

              if ! MOVE_OUTPUT=$(gh project item-edit \
                --id "$ITEM_ID" \
                --project-id "$PROJ_ID" \
                --field-id "$STATUS_FIELD_ID" \
                --single-select-option-id "$TARGET_OPT_ID" 2>&1); then
                if echo "$MOVE_OUTPUT" | grep -q "no changes to make"; then
                  echo "Already in '$TARGET_STATUS'."
                else
                  echo "$MOVE_OUTPUT"
                  exit 1
                fi
              fi

              gh issue edit "$ISSUE_NUMBER" --add-label "$APPROVAL_LABEL" --repo "$REPO"

              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body \
                "✅ This issue received **$UNIQUE_REACTION_COUNT** unique 👍 approvals (threshold: **$THRESHOLD**) and was automatically moved from **$SOURCE_STATUS** to **$TARGET_STATUS**."
            else
              echo "Not enough 👍 approvals yet."
            fi

            echo "----------------------------------------"
          done <<< "$ITEMS_IN_APPROVAL"
