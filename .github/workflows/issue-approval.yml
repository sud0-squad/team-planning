name: Scheduled Issue Approval Counter

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  tally-votes-and-move:
    runs-on: ubuntu-latest
    steps:
      - name: Check Approval Reactions, Move Card, Label, and Comment
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: "sud0-squad"
          PROJECT_NUM: 3
        run: |
          set -euo pipefail

          THRESHOLD=4
          APPROVAL_LABEL="approved"
          SOURCE_STATUS="Approvals"
          TARGET_STATUS="Approved"

          echo "Repo: $REPO | Owner: $OWNER | Project: $PROJECT_NUM"
          echo "Source Status: $SOURCE_STATUS | Target Status: $TARGET_STATUS"

          # Ensure label exists
          if ! gh api "repos/$REPO/labels/$APPROVAL_LABEL" >/dev/null 2>&1; then
            echo "Creating missing label: $APPROVAL_LABEL"
            gh label create "$APPROVAL_LABEL" \
              --color "0e8a16" \
              --description "Issue reached approval threshold" \
              --repo "$REPO"
          fi

          # Get project node ID via GraphQL (reliable for project item-edit)
          PROJ_ID=$(gh api graphql -f query='
          query($owner:String!, $number:Int!) {
            organization(login:$owner) {
              projectV2(number:$number) {
                id
              }
            }
          }' -f owner="$OWNER" -F number="$PROJECT_NUM" --jq '.data.organization.projectV2.id')

          if [ -z "${PROJ_ID:-}" ] || [ "$PROJ_ID" = "null" ]; then
            echo "ERROR: Could not resolve ProjectV2 ID for owner=$OWNER project=$PROJECT_NUM"
            exit 1
          fi

          # Get Status field + options via gh project field-list
          STATUS_FIELD_ID=$(gh project field-list "$PROJECT_NUM" --owner "$OWNER" --format json --jq '.fields[] | select(.name=="Status") | .id')
          SOURCE_OPT_ID=$(gh project field-list "$PROJECT_NUM" --owner "$OWNER" --format json --jq '.fields[] | select(.name=="Status") | .options[] | select(.name=="'"$SOURCE_STATUS"'") | .id')
          TARGET_OPT_ID=$(gh project field-list "$PROJECT_NUM" --owner "$OWNER" --format json --jq '.fields[] | select(.name=="Status") | .options[] | select(.name=="'"$TARGET_STATUS"'") | .id')

          if [ -z "${STATUS_FIELD_ID:-}" ] || [ "$STATUS_FIELD_ID" = "null" ]; then
            echo "ERROR: Status field not found on project."
            exit 1
          fi
          if [ -z "${SOURCE_OPT_ID:-}" ] || [ "$SOURCE_OPT_ID" = "null" ]; then
            echo "ERROR: Source status option '$SOURCE_STATUS' not found."
            exit 1
          fi
          if [ -z "${TARGET_OPT_ID:-}" ] || [ "$TARGET_OPT_ID" = "null" ]; then
            echo "ERROR: Target status option '$TARGET_STATUS' not found."
            exit 1
          fi

          echo "Debug: project issues and detected Status values"
          gh api graphql -f query='
          query($owner:String!, $number:Int!) {
            organization(login:$owner) {
              projectV2(number:$number) {
                items(first:100) {
                  nodes {
                    id
                    content {
                      __typename
                      ... on Issue {
                        number
                        title
                      }
                    }
                    fieldValues(first:50) {
                      nodes {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name
                          field {
                            ... on ProjectV2SingleSelectField {
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }' -f owner="$OWNER" -F number="$PROJECT_NUM" --jq '
            .data.organization.projectV2.items.nodes[]
            | select(.content.__typename == "Issue")
            | {
                issue: .content.number,
                title: .content.title,
                statusValues: [ .fieldValues.nodes[]? | select(.field.name=="Status") | .name ]
              }'

          # Find only issues currently in SOURCE_STATUS (Approvals)
          # Output lines: "<ITEM_ID> <ISSUE_NUMBER>"
          ITEMS_IN_SOURCE=$(gh api graphql -f query='
          query($owner:String!, $number:Int!) {
            organization(login:$owner) {
              projectV2(number:$number) {
                items(first:100) {
                  nodes {
                    id
                    content {
                      __typename
                      ... on Issue {
                        number
                      }
                    }
                    fieldValues(first:50) {
                      nodes {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name
                          field {
                            ... on ProjectV2SingleSelectField {
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }' -f owner="$OWNER" -F number="$PROJECT_NUM" --jq '
            .data.organization.projectV2.items.nodes[]
            | select(.content.__typename == "Issue")
            | select(any(.fieldValues.nodes[]?; .field.name=="Status" and .name=="'"$SOURCE_STATUS"'"))
            | "\(.id) \(.content.number)"')

          if [ -z "${ITEMS_IN_SOURCE:-}" ]; then
            echo "No issues in '$SOURCE_STATUS'."
            exit 0
          fi

          while IFS=' ' read -r ITEM_ID ISSUE_NUMBER; do
            [ -z "${ITEM_ID:-}" ] && continue
            [ -z "${ISSUE_NUMBER:-}" ] && continue

            echo "Checking issue #$ISSUE_NUMBER (item $ITEM_ID)..."

            # Skip if already labeled approved
            if gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx "$APPROVAL_LABEL"; then
              echo "Issue #$ISSUE_NUMBER already has '$APPROVAL_LABEL'. Skipping."
              echo "----------------------------------------"
              continue
            fi

            # Count ONLY unique +1 reactions on issue body
            UNIQUE_REACTION_COUNT=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPO/issues/$ISSUE_NUMBER/reactions?per_page=100" \
              --jq '[.[] | select(.content == "+1") | .user.login] | unique | length')

            echo "Unique 👍 approvals: $UNIQUE_REACTION_COUNT"

            if [ "$UNIQUE_REACTION_COUNT" -ge "$THRESHOLD" ]; then
              echo "Threshold reached for #$ISSUE_NUMBER. Moving to '$TARGET_STATUS'..."

              if ! MOVE_OUTPUT=$(gh project item-edit \
                --id "$ITEM_ID" \
                --project-id "$PROJ_ID" \
                --field-id "$STATUS_FIELD_ID" \
                --single-select-option-id "$TARGET_OPT_ID" 2>&1); then
                if echo "$MOVE_OUTPUT" | grep -q "no changes to make"; then
                  echo "Already in '$TARGET_STATUS'."
                else
                  echo "$MOVE_OUTPUT"
                  exit 1
                fi
              fi

              echo "Adding label '$APPROVAL_LABEL'..."
              gh issue edit "$ISSUE_NUMBER" --add-label "$APPROVAL_LABEL" --repo "$REPO"

              echo "Posting comment..."
              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body \
                "✅ This issue received **$UNIQUE_REACTION_COUNT** unique 👍 approvals (threshold: **$THRESHOLD**) and was automatically moved from **$SOURCE_STATUS** to **$TARGET_STATUS**."
            else
              echo "Not enough 👍 approvals yet for #$ISSUE_NUMBER."
            fi

            echo "----------------------------------------"
          done <<< "$ITEMS_IN_SOURCE"
